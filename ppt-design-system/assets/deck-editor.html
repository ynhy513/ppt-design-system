<header class="deck-toolbar">
  <div class="deck-title" id="deck-title"></div>
  <nav class="deck-nav" aria-label="幻灯片导航">
    <button type="button" id="previous" aria-label="上一页">‹</button>
    <select id="page-select" aria-label="跳到幻灯片"></select>
    <button type="button" id="next" aria-label="下一页">›</button>
  </nav>
  <div class="deck-actions">
    <button type="button" id="full-screen">全屏</button>
    <button type="button" id="edit-mode" aria-pressed="false">编辑</button>
    <button type="button" id="download-html" hidden>另存 HTML</button>
    <details class="deck-export" id="export-menu" hidden>
      <summary>导出</summary>
      <div id="export-options">
        <button type="button" id="export-pptx">可编辑 PPTX</button>
        <button type="button" id="export-pdf">PDF</button>
      </div>
    </details>
  </div>
</header>
<aside class="deck-inspector" id="inspector" hidden aria-label="编辑幻灯片">
  <div class="inspector-title">
    <h1>编辑本页</h1>
    <div class="inspector-actions">
      <button type="button" id="undo" disabled>撤销</button>
      <button type="button" id="reset-page">重置本页</button>
    </div>
  </div>
  <p id="page-intent"></p>
  <label for="layer-select">图层</label>
  <select id="layer-select"></select>
  <div id="geometry" hidden>
    <label>左 %<input type="number" id="left" min="0" max="100" step="0.1"></label>
    <label>上 %<input type="number" id="top" min="0" max="100" step="0.1"></label>
    <label>宽 %<input type="number" id="width" min="0.5" max="100" step="0.1"></label>
    <label>高 %<input type="number" id="height" min="0.5" max="100" step="0.1"></label>
  </div>
  <label for="slot-select">内容</label>
  <select id="slot-select"></select>
  <label for="slot-text" class="sr-only">文字</label>
  <textarea id="slot-text" rows="4" hidden></textarea>
  <button type="button" id="replace-image" hidden>换图</button>
  <input type="file" id="image-file" accept="image/png,image/jpeg,image/webp" hidden>
  <div class="inspector-footer">
    <button type="button" id="download-edits">导出修改</button>
    <button type="button" id="load-edits">导入修改</button>
    <input type="file" id="edits-file" accept=".json,application/json" hidden>
  </div>
</aside>
<footer class="deck-footer">
  <span id="page-counter"></span>
  <span id="layout-warning" role="status"></span>
  <span id="save-status" role="status"></span>
</footer>
