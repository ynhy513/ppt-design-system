<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="workflow-zh-CN-title workflow-zh-CN-desc" id="ppt-workflow-public-zh-CN-root">
  <title id="workflow-zh-CN-title">PPT-design-system 的提取、选版与制作流程</title>
  <desc id="workflow-zh-CN-desc">参考稿经提取成为冻结的设计包，设计包与语义稿共同进入选版，匹配唯一配方时制作和导出，否则审阅并调整后重试。</desc>
  <defs>
      <style>#ppt-workflow-public-zh-CN-root { --color-paper:#f5f5f5;
    --color-paper-2:#ececec;
    --color-ink:#2d3142;
    --color-muted:#4f5d75;
    --color-rule:#bfc0c0;
    --color-accent:#bf4520;
    --color-accent-tint:#f4e7e2;
    --color-link:#2e5aa8;
    --font-sans:Geist,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --font-serif:"Instrument Serif","Songti SC","Noto Serif CJK SC",serif;
    --font-mono:"Geist Mono",ui-monospace,monospace; }
      #ppt-workflow-public-zh-CN-root text { font-family:var(--font-sans);fill:var(--color-ink) }
      #ppt-workflow-public-zh-CN-root .node { fill:#fff;stroke:var(--color-rule);stroke-width:1.25 }
      #ppt-workflow-public-zh-CN-root .entry { fill:var(--color-paper);stroke:var(--color-rule);stroke-width:1.25 }
      #ppt-workflow-public-zh-CN-root .branch { fill:var(--color-paper);stroke:var(--color-muted);stroke-width:1.3 }
      #ppt-workflow-public-zh-CN-root .pack { fill:var(--color-accent-tint);stroke:var(--color-accent);stroke-width:1.75 }
      #ppt-workflow-public-zh-CN-root .phase { font:600 13px var(--font-mono);letter-spacing:.08em;fill:var(--color-muted) }
      #ppt-workflow-public-zh-CN-root .node-title { font-size:21px;font-weight:650 }
      #ppt-workflow-public-zh-CN-root .node-sub, #ppt-workflow-public-zh-CN-root .legend { font-size:15px;fill:var(--color-muted) }
      #ppt-workflow-public-zh-CN-root .route { fill:none;stroke:var(--color-muted);stroke-width:1.6 }
      #ppt-workflow-public-zh-CN-root .review { stroke-dasharray:5 5 }
      #ppt-workflow-public-zh-CN-root .arrow-label { font-size:13px;font-weight:600;fill:var(--color-muted) }</style>
    <marker id="ppt-workflow-public-zh-CN-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--color-muted)"/></marker>
  </defs>
  <rect width="1280" height="720" fill="var(--color-paper)"/>
  <rect x="24" y="28" width="1232" height="156" rx="6" fill="var(--color-paper-2)"/>
  <path d="M40 208H1240 M40 648H1240" stroke="var(--color-rule)"/>
  <text x="48" y="59" class="phase">从参考提取 · 可单独运行</text>
  <text x="48" y="245" class="phase">用设计包换稿 · 可从这里开始</text>

  <g class="route" marker-end="url(#ppt-workflow-public-zh-CN-workflow-arrow)">
    <path d="M256 120H314"/>
    <path d="M592 120H650"/>
    <path d="M724 164V192Q724 200 716 200H476Q468 200 468 208V270"/>
    <path d="M256 330H314"/>
    <path d="M592 330H632"/>
    <path d="M864 330H962"/>
    <path d="M748 400V462" class="review"/>
    <path d="M632 518H408Q400 518 400 510V386" class="review"/>
    <path d="M1100 384V462"/>
  </g>
  <rect x="892" y="292" width="60" height="28" rx="4" fill="var(--color-paper)"/>
  <text x="922" y="312" text-anchor="middle" class="arrow-label">唯一匹配</text>
  <rect x="760" y="418" width="120" height="28" rx="4" fill="var(--color-paper)"/>
  <text x="769" y="437" class="arrow-label">没匹配／多候选</text>
  <rect x="460" y="484" width="106" height="24" rx="4" fill="var(--color-paper)"/>
  <text x="513" y="501" text-anchor="middle" class="arrow-label">确认后重试</text>

  <g class="station" data-check="48,88,208,64">
    <rect x="48" y="88" width="208" height="64" rx="20" class="entry"/>
    <text x="64" y="116" class="node-title">参考稿</text>
    <text x="64" y="138" class="node-sub">PPTX、PDF 或截图</text>
  </g>
  <g class="station" data-check="316,76,276,88">
    <rect x="316" y="76" width="276" height="88" rx="6" class="node"/>
    <text x="332" y="105" class="node-title">Extract · 提取</text>
    <text x="332" y="130" class="node-sub">扫描对象、素材与样式证据</text>
    <text x="332" y="150" class="node-sub">确认版式，原文重放核对</text>
  </g>
  <g class="station" data-check="652,76,280,88">
    <rect x="652" y="76" width="280" height="88" rx="6" class="pack"/>
    <text x="668" y="105" class="node-title">冻结的设计包 ZIP</text>
    <text x="668" y="130" class="node-sub">样式、版式、配方、证据与素材</text>
    <text x="668" y="150" class="node-sub">换稿时继续使用这份基线</text>
  </g>
  <g class="station" data-check="48,296,208,68">
    <rect x="48" y="296" width="208" height="68" rx="20" class="entry"/>
    <text x="64" y="324" class="node-title">新文稿</text>
    <text x="64" y="347" class="node-sub">整理成关系、字段与项数</text>
  </g>
  <g class="station" data-check="316,272,276,112">
    <rect x="316" y="272" width="276" height="112" rx="6" class="node"/>
    <text x="332" y="305" class="node-title">Reuse · 选版与填槽</text>
    <text x="332" y="333" class="node-sub">核对关系、字段、项数与容量</text>
    <text x="332" y="357" class="node-sub">记录配方、密度与槽位用量</text>
  </g>
  <g class="station" data-check="632,260,232,140">
    <path d="M748 260L864 330L748 400L632 330Z" class="branch"/>
    <text x="748" y="327" text-anchor="middle" class="node-title">唯一可用的</text>
    <text x="748" y="353" text-anchor="middle" class="node-title">版式配方？</text>
  </g>
  <g class="station" data-check="964,272,272,112">
    <rect x="964" y="272" width="272" height="112" rx="6" class="node"/>
    <text x="980" y="305" class="node-title">Make · 制作</text>
    <text x="980" y="333" class="node-sub">用分镜渲染，复核继承和排版</text>
    <text x="980" y="357" class="node-sub">在编辑页改字、换图、移组件</text>
  </g>
  <g class="station" data-check="632,464,260,108">
    <rect x="632" y="464" width="260" height="108" rx="6" class="entry"/>
    <text x="648" y="496" class="node-title">审阅匹配报告</text>
    <text x="648" y="524" class="node-sub">看样张选版，或拆页适配</text>
    <text x="648" y="548" class="node-sub">按需在工作副本补版式</text>
  </g>
  <g class="station" data-check="964,464,272,108">
    <rect x="964" y="464" width="272" height="108" rx="20" class="entry"/>
    <text x="980" y="496" class="node-title">交付</text>
    <text x="980" y="524" class="node-sub">可编辑 HTML、PPTX、PDF</text>
    <text x="980" y="548" class="node-sub">PDF 继承检查可拦截文字越界</text>
  </g>
  <g aria-hidden="true">
    <path d="M48 681H80" class="route" marker-end="url(#ppt-workflow-public-zh-CN-workflow-arrow)"/>
    <text x="94" y="686" class="legend">流程与交接</text>
    <path d="M248 681H280" class="route review" marker-end="url(#ppt-workflow-public-zh-CN-workflow-arrow)"/>
    <text x="294" y="686" class="legend">审阅与重试</text>
  </g>
</svg>
